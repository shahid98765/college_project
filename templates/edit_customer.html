{% extends "base.html" %}

{% block title %}Edit Customer{% endblock %}

{% block page_title %}Edit Customer{% endblock %}



{% block content %}




<div class="page-header">


    <h2>

        <i class="fa-solid fa-user-pen"></i>

        Edit Customer

    </h2>





    <a href="{{ url_for('customers') }}"

       class="btn btn-secondary">


        <i class="fa-solid fa-arrow-left"></i>

        Back


    </a>



</div>









<div class="form-container">


<div class="form-card">






<form method="POST"

      action="{{ url_for('edit_customer',
      id=customer.id) }}">








<div class="form-row">





<div class="form-group">



<label>


<i class="fa-solid fa-user"></i>

Customer Name


</label>






<input type="text"

       name="name"

       value="{{ customer.name }}"

       required>



</div>









<div class="form-group">



<label>


<i class="fa-solid fa-phone"></i>

Mobile Number


</label>






<input type="tel"

       name="phone"

       value="{{ customer.phone }}"

       maxlength="10"

       required>



</div>






</div>









<div class="form-row">







<div class="form-group">



<label>


<i class="fa-solid fa-envelope"></i>

Email Address


</label>






<input type="email"

       name="email"

       value="{{ customer.email }}">



</div>









<div class="form-group">



<label>


<i class="fa-solid fa-location-dot"></i>

Address


</label>






<textarea

name="address"

rows="5">{{ customer.address }}</textarea>



</div>







</div>









<div class="form-buttons">







<button type="submit"

        class="btn btn-success">



<i class="fa-solid fa-save"></i>


Update Customer



</button>









<button type="reset"

        class="btn btn-warning">



<i class="fa-solid fa-rotate-left"></i>


Reset



</button>








<a href="{{ url_for('customers') }}"

   class="btn btn-danger">



<i class="fa-solid fa-times"></i>


Cancel



</a>







</div>








</form>





</div>


</div>






{% endblock %}
